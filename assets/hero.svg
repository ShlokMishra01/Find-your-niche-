<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">Find Your Niche</title>
  <desc id="description">Cross-medium discovery for movies, books, music, and open-source projects.</desc>
  <style>
    .tile { fill: #131916; stroke: #ffffff1c; stroke-width: 1; }
    .move-up { animation: up 34s linear infinite; }
    .move-down { animation: down 38s linear infinite; }
    .ring { transform-origin: 1045px 210px; animation: rotate 70s linear infinite; }
    .title { opacity: 0; animation: enter .9s .12s cubic-bezier(.2,.7,.2,1) forwards; }
    .subtitle { opacity: 0; animation: enter .8s .55s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes up { from { transform: translateY(0); } to { transform: translateY(-660px); } }
    @keyframes down { from { transform: translateY(-660px); } to { transform: translateY(0); } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes enter { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; opacity: 1 !important; } }
  </style>
